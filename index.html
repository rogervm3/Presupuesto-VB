<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presupuesto · Roger & Marcela</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{
  --bg:#EEF1F3; --surface:#fff; --ink:#16323F; --ink2:#4A5560; --line:#DCE3E7;
  --teal:#0E7C86; --tealSoft:#E3F1F2; --green:#2F9E6B; --greenSoft:#E4F3EC;
  --coral:#E4572E; --coralSoft:#FBE7DF; --amber:#C98A16; --amberSoft:#FBF0D9; --muted:#8A97A0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:'Space Grotesk',Inter,sans-serif;font-feature-settings:'tnum'}
.app{display:flex;min-height:100vh}
aside{width:210px;background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 22px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--teal);display:grid;place-items:center;font-size:16px}
.navbtn{width:100%;text-align:left;background:transparent;color:rgba(255,255,255,.72);border:none;border-radius:10px;padding:11px 12px;margin-bottom:4px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.navbtn.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
main{flex:1;padding:26px clamp(16px,3vw,38px);max-width:1180px;margin:0 auto;width:100%}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.eyebrow{font-size:13px;letter-spacing:1px;color:var(--teal);text-transform:uppercase;font-weight:600}
.title{font-size:26px;font-weight:700;margin-top:2px}
select,input{font-family:inherit}
.msel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600;color:var(--ink);cursor:pointer}
.curtog{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.curtog button{border:none;background:transparent;padding:10px 13px;font-weight:700;cursor:pointer;color:var(--ink2);font-size:13px;font-family:'Space Grotesk',Inter,sans-serif}
.curtog button.on{background:var(--teal);color:#fff}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-teal{background:var(--teal);color:#fff}
.btn-ink{background:var(--ink);color:#fff}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.lift{transition:transform .12s,box-shadow .12s}.lift:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(22,50,63,.10)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi-l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi-v{font-size:25px;font-weight:700;margin-top:8px}
.kpi-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.bar{height:7px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.rowh{border-radius:8px}.rowh:hover{background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;font-weight:600;color:var(--ink2);text-align:left;background:var(--bg);white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--line)}
.muted{color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.catcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.foot{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(22,50,63,.42);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(22,50,63,.28)}
.modal.wide{width:min(760px,96%)}
.mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.mbody{padding:22px;overflow-y:auto;display:grid;gap:14px}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
label.f{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;display:block}
.field{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;width:100%;outline:none;background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.seg{display:flex;gap:8px;background:var(--bg);padding:4px;border-radius:10px}
.seg button{flex:1;padding:9px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:transparent;color:var(--ink2)}
.iconbtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:inline-flex}
.cellsel{border:1px solid transparent;background:transparent;font-family:inherit;font-size:13px;padding:4px 6px;border-radius:8px;cursor:pointer;color:var(--ink2);max-width:180px}
.cellsel:hover{border-color:var(--line);background:#fff}
.cellsel:focus{outline:none;border-color:var(--teal);background:#fff}
.filterrow th{background:#fff;border-top:1px solid var(--line);padding:6px 10px}
.hfilter{width:100%;max-width:170px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;background:#fff;color:var(--ink2);cursor:pointer;font-family:inherit}
.hfilter:focus{outline:none;border-color:var(--teal)}
.close{background:none;border:none;cursor:pointer;color:var(--muted)}
@media(max-width:640px){
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:static;display:flex;gap:4px;padding:10px;overflow-x:auto}
  .brand{display:none}.navbtn{white-space:nowrap;margin:0}
  .two{grid-template-columns:1fr}
  .kpi-big-row{grid-template-columns:1fr!important}
  .kpi-stat-grid{grid-template-columns:1fr 1fr!important}
}

/* header menus */
.colh{padding:0!important}
.colh-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:none;border:none;padding:10px 14px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--ink2);white-space:nowrap;font-size:13px}
.colh.rt .colh-btn{flex-direction:row-reverse}
.colh-btn:hover{background:#e6edf1}
.colh-ic{color:var(--muted);font-size:10px}
.colh-ic.on{color:var(--teal)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;color:var(--teal);font-weight:600;font-size:12px;font-family:inherit}
/* popover */
.popback{position:fixed;inset:0;z-index:60}
.pop{position:fixed;z-index:61;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(22,50,63,.22);padding:8px;font-size:13px}
.pop-sort{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.pop-sort button{text-align:left;background:none;border:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13px;font-family:inherit}
.pop-sort button:hover{background:var(--bg)}
.pop-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none;margin-bottom:6px;font-family:inherit}
.pop-list{max-height:220px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin-bottom:6px}
.pop-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.pop-item:hover{background:var(--bg)}
.pop-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-all{border-bottom:1px solid var(--line);margin-bottom:2px}
.pop-foot{display:flex;justify-content:space-between;gap:8px}
.pop-foot button{border:none;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
.pop-foot [data-clearcol]{background:none;color:var(--ink2)}
.pop-foot .pl-primary{background:var(--teal);color:#fff}
/* summary + category tables */
.sumt,.catt{width:100%;border-collapse:collapse;font-size:13px}
.sumt th,.catt th{background:var(--bg);color:var(--ink2);text-align:left;padding:9px 12px;font-weight:600;white-space:nowrap}
.sumt td,.catt td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
.rt{text-align:right}
.sumt .sum-main td{background:#fff;font-weight:600}
.sumt .sub-h td{background:var(--bg);font-weight:700;font-size:12px;color:var(--ink2);padding:6px 12px}
.sumt .sub td{color:var(--ink2);font-size:12.5px}
.sumt .sum-bal td{background:var(--tealSoft);font-weight:700;border-top:2px solid var(--teal)}
.exp{background:none;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);padding:0}
.exp:hover{color:var(--teal)}
.minput{width:110px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;text-align:right;outline:none}
.minput:focus{border-color:var(--teal)}
.mv-ghead{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;padding:13px 16px;cursor:pointer;font-family:inherit;font-size:14px}
.mv-ghead:hover{background:var(--bg)}
.mv-chead{display:flex;align-items:center;gap:10px;background:var(--bg);padding:7px 16px;font-weight:600;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line)}
.mv-row:hover td{background:var(--tealSoft)}
th.sortable:hover{background:#e6edf1;color:var(--ink)}
.swrow{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.imptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.imptbl th{background:var(--bg);color:var(--ink2);text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap;position:sticky;top:0}
.imptbl td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:middle}
.imp-in{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;outline:none;font-family:inherit;background:#fff}
.imp-in:focus{border-color:var(--teal)}
/* period bar */
.pbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.pbar-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pbar-lbl{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-right:2px}
.pchip{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.pchip:hover{border-color:var(--teal);color:var(--teal)}
.pchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pchip.mchip{padding:6px 10px}
.pchip.mchip.on{background:var(--teal);border-color:var(--teal)}
.pchip.avgtog.on{background:var(--amber);border-color:var(--amber)}
.pbar-sep{width:1px;height:26px;background:var(--line)}
.pbar-link{background:none;border:none;color:var(--teal);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}

.linkcell{background:none;border:none;padding:0;cursor:pointer;color:var(--teal);font-family:inherit;font-weight:600;font-size:13px}
.linkcell:hover{text-decoration:underline}
.catt .grp-h td{background:#eef3f6;border-top:2px solid var(--line);padding:9px 12px}
.grp-h{cursor:default}
.drag-handle{display:inline-block;cursor:grab;color:var(--muted);font-size:14px;margin-right:8px;padding:2px 4px;border-radius:4px;user-select:none}
.drag-handle:hover{color:var(--ink2);background:var(--line)}
.grp-h.dragging{opacity:.4}
.grp-h.drag-over{box-shadow:inset 0 2px 0 var(--teal),inset 0 -2px 0 var(--teal)}
.grp-h.drag-over td{background:var(--tealSoft)}

.catt .grp-h .exp{font-size:13.5px}
.catt .cat-r td{border-top:1px solid #eef1f3}
.catt .grp-add td{border-top:none;padding:4px 12px 12px 26px}

@media(max-width:640px){
  main{padding:18px 12px}
  .title{font-size:20px}
  .head>div:last-child{width:100%;flex-wrap:wrap}
  .r2,.r3{grid-template-columns:1fr}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .overlay{place-items:end center;padding:0}
}

var txType="gasto";
var txPresetGroup=null;var txPresetCat=null;
function openTx(presetGroup,presetCat){txType=(presetGroup==="Ingresos")?"ingreso":"gasto";txPresetGroup=presetGroup||null;txPresetCat=presetCat||null;openModal('<div class="mhead">Nuevo movimiento <button class="close" data-close>✕</button></div><div class="mbody" id="txBody"></div><div class="mfoot"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-teal" data-savetx>Guardar movimiento</button></div>');renderTxBody();}
function txGroupOpts(){return txType==="ingreso"?["Ingresos"]:groupsList().filter(function(x){return x!=="Ingresos";});}
function txCatOpts(g){return alpha(state.categories.filter(function(c){if(c.type!==txType||c.group!==g)return false;if(txType==="ingreso")return bud(c)>0;return true;}).map(function(c){return c.name;}));}
function defaultTxDate(){
  var now=new Date();var realY=now.getFullYear(),realM=now.getMonth()+1,realD=now.getDate();
  var ty,tm;
  if(ui.pMode==="year"&&ui.pMonths.length===1){ty=+ui.pYear;tm=ui.pMonths[0];}
  else{var ly=latestYM();if(ly){ty=+ly.slice(0,4);tm=+ly.slice(5,7);}else{ty=realY;tm=realM;}}
  var lastDay=new Date(ty,tm,0).getDate();
  var day=(ty===realY&&tm===realM)?realD:Math.min(realD,lastDay);
  return ty+"-"+(tm<10?"0":"")+tm+"-"+(day<10?"0":"")+day;
}
function renderTxBody(){

  var gopts=txGroupOpts();var firstG=(txPresetGroup&&gopts.indexOf(txPresetGroup)>=0)?txPresetGroup:(gopts[0]||"");var copts=txCatOpts(firstG);

   +'<div class="r2"><div><label class="f">Fecha</label><input class="field" id="f_date" type="date" value="'+today+'"></div><div><label class="f">Persona</label><select class="field" id="f_person">'+alpha(s.people).map(function(p){return '<option>'+esc(p)+'</option>';}).join("")+'</select></div></div>'
   +'<div class="r2"><div><label class="f">Grupo</label><select class="field" id="f_group">'+gopts.map(function(g){return '<option'+(g===firstG?" selected":"")+'>'+esc(g)+'</option>';}).join("")+'</select></div><div><label class="f">Categoría</label><select class="field" id="f_cat">'+copts.map(function(n){return '<option'+(n===firstC?" selected":"")+'>'+esc(n)+'</option>';}).join("")+'</select></div></div>'
   +'<div id="f_budinfo"></div>'
   +'<div><label class="f">Concepto</label><input class="field" id="f_concept" placeholder="Ej. Compra semanal"></div>'
   +'<div class="r2"><div><label class="f">Moneda</label><select class="field" id="f_cur"><option value="COR">C$</option><option value="USD">US$</option></select></div><div><label class="f">Monto</label><input class="field num" id="f_amount" type="number" placeholder="0.00"></div></div>';
  var gsel=document.getElementById("f_group");
  var csel=document.getElementById("f_cat");
  gsel.addEventListener("change",function(){var opts=txCatOpts(gsel.value);csel.innerHTML=opts.map(function(n){return '<option>'+esc(n)+'</option>';}).join("");renderTxBudInfo();});
  csel.addEventListener("change",renderTxBudInfo);

function ipad(n){return (n<10?"0":"")+n;}
function parseImpNum(s){s=String(s).replace(/[^0-9.,\-]/g,"").trim();if(!s||s==="-")return NaN;var lc=s.lastIndexOf(","),ld=s.lastIndexOf(".");if(lc>-1&&ld>-1){if(lc>ld)s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");}else if(lc>-1){if(/,\d{2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");}else s=s.replace(/,/g,"");return parseFloat(s);}
function parseImpDate(s){s=String(s).trim();var m;if(m=s.match(/(\d{4})-(\d{2})-(\d{2})/))return m[1]+"-"+m[2]+"-"+m[3];if(m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/)){var d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12){var t=d;d=mo;mo=t;}return y+"-"+ipad(mo)+"-"+ipad(d);}var mon={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12,jan:1,apr:4,aug:8,dec:12};if(m=s.match(/(\d{1,2})[\/\-\s]([a-zA-Z]{3})[a-zA-Z]*[\/\-\s]*(\d{2,4})?/)){var mm=mon[m[2].toLowerCase()];if(mm){var yy=m[3]?+m[3]:(new Date().getFullYear());if(yy<100)yy+=2000;return yy+"-"+ipad(mm)+"-"+ipad(+m[1]);}}return null;}
function splitCells(line,delim){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===delim&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out.map(function(x){return x.trim().replace(/^"|"$/g,"");});}
function parseStatement(text,def){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l.length;});
  if(!lines.length)return [];
  var rows=[];
  // CSV detection: mask thousands-separator commas (e.g. 2,200.00) so they aren't
  // mistaken for a delimiter, then require a CONSISTENT field count (>=2) across most lines
  function maskThousands(l){return l.replace(/(\d),(\d{3})(?=\D|$)/g,function(m,a,b){return a+b;});}
  var delims=[",",";","\t","|"];var best=null,bestScore=-1;
  delims.forEach(function(d){
    var sampleLines=lines.slice(0,10).map(function(l){return d===","?maskThousands(l):l;});
    var counts=sampleLines.map(function(l){return splitCells(l,d).length;});
    var freq={};counts.forEach(function(c){freq[c]=(freq[c]||0)+1;});
    var modeCount=0,modeVal=1;
    Object.keys(freq).forEach(function(k){if(freq[k]>modeCount){modeCount=freq[k];modeVal=+k;}});
    var consistency=modeCount/counts.length;
    var score=(modeVal>=2&&consistency>=0.7)?consistency*modeVal:-1;
    if(score>bestScore){bestScore=score;best=d;}
  });
  var isCSV=bestScore>0&&best;
  if(isCSV){
    var table=lines.map(function(l){return splitCells(best===","?maskThousands(l):l,best);});
    var ncol=Math.max.apply(null,table.map(function(r){return r.length;}));
    // detect header
    var hdrIdx=-1;
    for(var i=0;i<Math.min(3,table.length);i++){var joined=table[i].join(" ").toLowerCase();if(/fecha|date|descrip|concepto|detalle|monto|importe|valor|cargo|debito|débito|credito|crédito|amount/.test(joined)){hdrIdx=i;break;}}
    var hdr=hdrIdx>=0?table[hdrIdx].map(function(x){return x.toLowerCase();}):null;
    var dataRows=table.slice(hdrIdx>=0?hdrIdx+1:0);
    var colDate=-1,colDesc=-1,colAmt=-1,colDebit=-1,colCredit=-1;
    if(hdr){hdr.forEach(function(h,i){if(colDate<0&&/fecha|date/.test(h))colDate=i;if(colDesc<0&&/descrip|concepto|detalle|referencia|comercio|transacc/.test(h))colDesc=i;if(/cargo|debito|débito|retiro|compra/.test(h))colDebit=i;if(/abono|credito|crédito|deposito|depósito|pago/.test(h))colCredit=i;if(colAmt<0&&/monto|importe|valor|amount/.test(h))colAmt=i;});}
    // infer missing columns from data
    function looksDate(v){return !!parseImpDate(v);}
    function looksNum(v){return !isNaN(parseImpNum(v))&&/\d/.test(v);}
    if(colDate<0){for(var c=0;c<ncol;c++){var hits=0;dataRows.slice(0,10).forEach(function(r){if(r[c]&&looksDate(r[c]))hits++;});if(hits>=Math.min(3,dataRows.length)){colDate=c;break;}}}
    if(colAmt<0&&colDebit<0&&colCredit<0){var numc=[];for(var c2=0;c2<ncol;c2++){var nh=0;dataRows.slice(0,10).forEach(function(r){if(r[c2]&&looksNum(r[c2]))nh++;});if(nh>=Math.min(3,dataRows.length))numc.push(c2);}if(numc.length)colAmt=numc[numc.length-1];}
    if(colDesc<0){var bestLen=-1;for(var c3=0;c3<ncol;c3++){if(c3===colDate||c3===colAmt)continue;var tot=0,cnt=0;dataRows.slice(0,10).forEach(function(r){if(r[c3]){tot+=r[c3].length;cnt++;}});var avg=cnt?tot/cnt:0;if(avg>bestLen&&!looksNum(dataRows[0]&&dataRows[0][c3]||"")){bestLen=avg;colDesc=c3;}}}
    var cardPaymentReCsv=/pago recib|su pago|pago aplicado|gracias por su pago|pago efectuado|bonificacion pago saldo/i;
    dataRows.forEach(function(r){
      if(colDate<0||!r[colDate])return;var date=parseImpDate(r[colDate]);if(!date)return;
      var amount=NaN,type="gasto";
      if(colDebit>=0||colCredit>=0){var deb=colDebit>=0?parseImpNum(r[colDebit]||""):NaN;var cre=colCredit>=0?parseImpNum(r[colCredit]||""):NaN;if(!isNaN(cre)&&cre>0){amount=cre;type="ingreso";}else if(!isNaN(deb)&&deb>0){amount=deb;type="gasto";}}
      else if(colAmt>=0){var raw=parseImpNum(r[colAmt]||"");if(!isNaN(raw)){amount=Math.abs(raw);type=raw<0?"gasto":"gasto";}}
      if(isNaN(amount)||!amount)return;
      var concept=colDesc>=0?(r[colDesc]||""):"";
      if(cardPaymentReCsv.test(concept))return;
      rows.push({date:date,concept:concept,amount:amount,type:type});
    });
  } else {
    // freeform (pasted PDF text): find lines with a date and a trailing amount.
    // Statements often have two trailing number columns (e.g. Local/Dólares) where
    // the last one is 0.00 — scan backward for the last NON-ZERO amount instead of
    // blindly taking the very last token. Skip boilerplate summary lines (payment
    // due dates, cut-off dates, etc.) that look like transactions but aren't.
    var boilerplateRe=/pago m[ií]nimo|pago contado|fecha de corte|fecha l[ií]mite|producto\s*:|nombre\s*:|saldo al corte|previous balance|disponible|puntos\s|intereses corrientes/i;
    var cardPaymentRe=/pago recib|su pago|pago aplicado|gracias por su pago|pago efectuado|bonificacion pago saldo/i;
    lines.forEach(function(l){
      if(boilerplateRe.test(l))return;
      if(cardPaymentRe.test(l))return;
      var date=parseImpDate(l);if(!date)return;
      var amts=l.match(/-?[0-9][0-9.,]*[0-9]/g);if(!amts||!amts.length)return;
      var amount=null;
      for(var ai=amts.length-1;ai>=0;ai--){
        var cand=parseImpNum(amts[ai]);
        if(!isNaN(cand)&&cand!==0){amount=cand;break;}
      }
      if(amount===null)return;
      var concept=l.replace(/\S*\d{1,4}[\/\-]\d{1,2}[\/\-]?\d{0,4}\S*/,"");
      concept=concept.replace(/(\s*-?[0-9][0-9.,]*[0-9]){1,3}\s*$/,"");
      concept=concept.replace(/\s+/g," ").trim();
      rows.push({date:date,concept:concept||l.slice(0,40),amount:Math.abs(amount),type:amount<0?"ingreso":"gasto"});
    });
  }
  // currency hint + defaults + dedup
  return rows.map(function(r){
    var cur=def.cur;var low=r.concept.toLowerCase();
    if(/us\$|usd|d[oó]lar/.test(low))cur="USD";if(/c\$|c[oó]rdoba|nio/.test(low))cur="COR";
    var dup=state.transactions.some(function(t){return t.date===r.date&&Math.abs(Math.abs(t.currency==="USD"?t.amount:t.amount)-r.amount)<0.5&&(t.concept||"").slice(0,10).toLowerCase()===r.concept.slice(0,10).toLowerCase();});
    return {date:r.date,concept:r.concept,amount:r.amount,currency:cur,person:def.person,type:r.type,dup:dup};
  });
}
function openImport(){
  var s=state.settings;
  var h='<div class="mhead">Importar estado de cuenta <button class="close" data-close>✕</button></div>';
  h+='<div class="mbody">';
  h+='<div class="muted" style="font-size:12.5px">Sube un archivo <b>CSV</b> exportado del banco, o pega el texto del estado de cuenta (PDF). Detecto fecha, concepto y monto; los movimientos entran como <b>pendientes de clasificar</b>.</div>';
  h+='<div class="r2"><div><label class="f">Persona por defecto</label><select class="field" id="imp_person">'+alpha(s.people).map(function(p){return '<option>'+esc(p)+'</option>';}).join("")+'</select></div><div><label class="f">Moneda por defecto</label><select class="field" id="imp_cur"><option value="COR">C$</option><option value="USD">US$</option></select></div></div>';
  h+='<div><label class="f">Archivo (CSV o PDF)</label><input class="field" id="imp_file" type="file" accept=".csv,.txt,.pdf"></div>';
  h+='<div><label class="f">…o pega el texto aquí</label><textarea class="field" id="imp_text" rows="5" placeholder="Pega aquí las líneas del estado de cuenta"></textarea></div>';
  h+='<div style="text-align:right"><button class="btn btn-ink" data-impparse>Analizar</button></div>';
  h+='<div id="imp_preview"></div>';
  h+='</div>';
  openModal(h,true);
  document.getElementById("imp_file").addEventListener("change",handleImportFile);
}
function handleImportFile(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var name=(f.name||"").toLowerCase();
  if(name.slice(-4)===".pdf"){
    var st=document.getElementById("imp_text");st.value="Leyendo PDF…";
    loadPdfJs().then(function(pdfjsLib){
      var rd=new FileReader();
      rd.onload=function(){pdfjsLib.getDocument({data:new Uint8Array(rd.result)}).promise.then(function(pdf){
        var pages=[];for(var i=1;i<=pdf.numPages;i++)pages.push(i);
        return Promise.all(pages.map(function(n){return pdf.getPage(n).then(function(pg){return pg.getTextContent().then(function(tc){
          var items=tc.items.slice().sort(function(a,b){var ya=a.transform[5],yb=b.transform[5];if(Math.abs(ya-yb)>3)return yb-ya;return a.transform[4]-b.transform[4];});
          var out="",lastY=null;items.forEach(function(it){var y=it.transform[5];if(lastY!==null&&Math.abs(y-lastY)>3)out+="\n";out+=it.str+" ";lastY=y;});return out;
        });});})).then(function(txts){document.getElementById("imp_text").value=txts.join("\n");});
      });};
      rd.readAsArrayBuffer(f);
    }).catch(function(){document.getElementById("imp_text").value="";alert("No pude leer el PDF automáticamente (posiblemente sin conexión). Abre el PDF, copia el texto y pégalo en el recuadro.");});
  } else {
    var rd=new FileReader();rd.onload=function(){document.getElementById("imp_text").value=rd.result;};rd.readAsText(f,"utf-8");
  }
}
function loadPdfJs(){return new Promise(function(res,rej){if(window.pdfjsLib){res(window.pdfjsLib);return;}var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";sc.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);}catch(e){rej(e);}};sc.onerror=rej;document.head.appendChild(sc);});}
var IMP_STOPWORDS={NI:1,CB:1,APP:1,SUC:1,LOCAL:1,LOCALES:1,TARJETA:1,ATM:1,RET:1,RETIRO:1,PAGO:1,PAGOS:1,COMPRA:1,COMPRAS:1,VENTA:1,POS:1,REF:1,REFERENCIA:1,TRANSFERENCIA:1,DEBITO:1,CREDITO:1,MONEDA:1,USD:1,COR:1,DOLARES:1,CORDOBAS:1,DEL:1,LOS:1,LAS:1,UNA:1,POR:1,CON:1,PARA:1,QUE:1,SUS:1,GRACIAS:1,RECIBIDO:1,MANAGUA:1,GRANADA:1};
function impWords(s){return String(s||"").toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ0-9\s]/g," ").split(/\s+/).filter(function(w){return w.length>=3&&!IMP_STOPWORDS[w]&&!/^\d+$/.test(w);});}
function buildMerchantIndex(){
  var idx={};
  state.transactions.forEach(function(t){
    if(t.type!=="gasto"||isPending(t))return;
    var words=impWords(t.concept||t.merchant||"");
    var key=t.group+"\u0001"+t.category;
    words.forEach(function(w){if(!idx[w])idx[w]={};idx[w][key]=(idx[w][key]||0)+1;});
  });
  return idx;
}
function guessFromHistory(concept,idx){
  var words=impWords(concept);var scores={};
  words.forEach(function(w){if(!idx[w])return;Object.keys(idx[w]).forEach(function(k){scores[k]=(scores[k]||0)+idx[w][k];});});
  var best=null,bestScore=0;
  Object.keys(scores).forEach(function(k){if(scores[k]>bestScore){bestScore=scores[k];best=k;}});
  if(!best)return null;
  var parts=best.split("\u0001");
  return {group:parts[0],category:parts[1]};
}
function parseImport(){
  var text=document.getElementById("imp_text").value||"";
  var def={person:document.getElementById("imp_person").value,cur:document.getElementById("imp_cur").value};
  var rows=parseStatement(text,def);
  var midx=buildMerchantIndex();
  rows.forEach(function(r){
    if(r.type==="ingreso"){r.group="Ingresos";r.category="Otros Ingresos";r.guessed=false;return;}
    var g=guessFromHistory(r.concept,midx);
    if(g){r.group=g.group;r.category=g.category;r.guessed=true;}
    else{r.group="Otros";r.category="Por clasificar";r.guessed=false;}
  });
  ui._imp=rows;
  var box=document.getElementById("imp_preview");
  if(!rows.length){box.innerHTML='<div class="muted" style="padding:14px 0">No detecté movimientos. Verifica el formato o pega el texto con fecha y monto por línea.</div>';return;}
  var newN=rows.filter(function(r){return !r.dup;}).length;
  var guessedN=rows.filter(function(r){return r.guessed;}).length;
  var h='<div style="margin:10px 0 6px;font-weight:700;font-size:13px">'+rows.length+' detectados · '+newN+' nuevos'+(rows.length-newN?' · '+(rows.length-newN)+' posibles duplicados':'')+(guessedN?' · <span style="color:'+C.green+'">'+guessedN+' clasificados automáticamente por historial</span>':'')+'</div>';
  h+='<div style="overflow-x:auto;max-height:320px;overflow-y:auto"><table class="imptbl"><thead><tr><th></th><th>Fecha</th><th>Concepto</th><th>Persona</th><th class="rt">Monto</th><th>Mon.</th><th>Tipo</th><th>Grupo</th><th>Categoría</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    var gopts=(r.type==="ingreso"?["Ingresos"]:groupsList().filter(function(x){return x!=="Ingresos";}));
    var copts=state.categories.filter(function(c){return c.type===r.type&&c.group===r.group;}).map(function(c){return c.name;});
    if(copts.indexOf(r.category)<0)copts=[r.category].concat(copts);copts=alpha(copts);
    var gsel='<select class="imp-in" data-impf="group" data-impi="'+i+'" style="'+(r.guessed?"border-color:"+C.green+";color:"+C.green+";font-weight:600":"")+'">'+gopts.map(function(g){return '<option'+(g===r.group?" selected":"")+'>'+esc(g)+'</option>';}).join("")+'</select>';
    var csel='<select class="imp-in" data-impf="category" data-impi="'+i+'" style="'+(r.guessed?"border-color:"+C.green+";color:"+C.green+";font-weight:600":"")+'">'+copts.map(function(c){return '<option'+(c===r.category?" selected":"")+'>'+esc(c)+'</option>';}).join("")+'</select>';
    h+='<tr'+(r.dup?' style="opacity:.5"':'')+'><td><input type="checkbox" data-impchk="'+i+'"'+(r.dup?"":" checked")+'></td>'
     +'<td><input class="imp-in" data-impf="date" data-impi="'+i+'" value="'+esc(r.date)+'" style="width:105px"></td>'
     +'<td><input class="imp-in" data-impf="concept" data-impi="'+i+'" value="'+esc(r.concept)+'" style="min-width:180px"></td>'
     +'<td><select class="imp-in" data-impf="person" data-impi="'+i+'">'+alpha(state.settings.people).map(function(p){return '<option'+(p===r.person?" selected":"")+'>'+esc(p)+'</option>';}).join("")+'</select></td>'
     +'<td class="rt"><input class="imp-in num rt" data-impf="amount" data-impi="'+i+'" value="'+r.amount+'" style="width:90px"></td>'
     +'<td><select class="imp-in" data-impf="currency" data-impi="'+i+'"><option value="COR"'+(r.currency==="COR"?" selected":"")+'>C$</option><option value="USD"'+(r.currency==="USD"?" selected":"")+'>US$</option></select></td>'
     +'<td><select class="imp-in" data-impf="type" data-impi="'+i+'"><option value="gasto"'+(r.type==="gasto"?" selected":"")+'>Gasto</option><option value="ingreso"'+(r.type==="ingreso"?" selected":"")+'>Ingreso</option></select></td>'
     +'<td style="min-width:130px">'+gsel+'</td><td style="min-width:150px">'+csel+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="mfoot" style="padding:14px 0 0"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-teal" data-impcommit>Importar seleccionados</button></div>';
  box.innerHTML=h;
}
function commitImport(){
  var rows=ui._imp||[];var added=0;
  document.querySelectorAll("[data-impchk]").forEach(function(chk){
    if(!chk.checked)return;var i=+chk.getAttribute("data-impchk");var r=rows[i];if(!r)return;
    function gv(f){var el=document.querySelector('[data-impf="'+f+'"][data-impi="'+i+'"]');return el?el.value:"";}
    var type=gv("type")||r.type;var amount=parseFloat(gv("amount"))||r.amount;
    var group=gv("group")||r.group||(type==="ingreso"?"Ingresos":"Otros");
    var category=gv("category")||r.category||(type==="ingreso"?"Otros Ingresos":"Por clasificar");
    state.transactions.unshift({id:uid(),date:gv("date")||r.date,person:gv("person")||r.person,type:type,category:category,group:group,concept:gv("concept")||r.concept,merchant:"",account:"",method:"Importado",currency:gv("currency")||r.currency,amount:amount});
    added++;
  });
  save();closeModal();ui.view="movimientos";render();
  setTimeout(function(){alert(added+" movimiento(s) importado(s). Los que reconocí por historial ya tienen grupo y categoría; el resto está pendiente de clasificar.");},50);
}

/* ===== listeners ===== */
document.addEventListener("click",function(e){var t=e.target,el;
  if((el=t.closest("[data-view]"))){ui.view=el.dataset.view;ui.q="";render();return;}
  if((el=t.closest("[data-view-link]"))){ui.view=el.dataset.viewLink;render();return;}
  if(t.closest("[data-action='add-tx']")){openTx();return;}
  if(t.closest("[data-action='import']")){openImport();return;}
  if(t.closest("[data-impparse]")){parseImport();return;}
  if(t.closest("[data-impcommit]")){commitImport();return;}
  if((el=t.closest("[data-addtxgrp]"))){openTx(el.getAttribute("data-addtxgrp"),el.getAttribute("data-addtxcat"));return;}
  if(t.closest("[data-action='add-cat']")){openCat();return;}
  if(t.closest("[data-action='add-group']")){openGroup();return;}
  if(t.closest("[data-action='add-income']")){openAddIncome();return;}
  if((el=t.closest("[data-saveincome]"))){saveIncome(el.getAttribute("data-saveincome"));return;}
  if((el=t.closest("[data-addcatgrp]"))){openCat(el.getAttribute("data-addcatgrp"));return;}
  if((el=t.closest("[data-delgroup]"))){delGroup(el.getAttribute("data-delgroup"));return;}
  if((el=t.closest("[data-editgrp]"))){openEditGroup(el.getAttribute("data-editgrp"));return;}
  if((el=t.closest("[data-saveeditgrp]"))){saveEditGroup(el.getAttribute("data-saveeditgrp"));return;}
  if((el=t.closest("[data-gcol]"))){var gg=el.getAttribute("data-gcol");ui.collapsed[gg]=!ui.collapsed[gg];render();return;}
  if((el=t.closest("[data-movgcol]"))){var mg=el.getAttribute("data-movgcol");ui.movCollapsed[mg]=!ui.movCollapsed[mg];render();return;}
  if((el=t.closest("[data-del]"))){var id=el.dataset.del;if(confirm("¿Eliminar este movimiento? Esta acción no se puede deshacer.")){state.transactions=state.transactions.filter(function(r){return r.id!==id;});save();render();}return;}
  if((el=t.closest("[data-classify]"))){openClassify(el.getAttribute("data-classify"));return;}
  if((el=t.closest("[data-saveclassify]"))){saveClassify(el.getAttribute("data-saveclassify"));return;}
  if(t.closest("[data-action='clearfilters']")){ui.colFilters={};ui.sort=null;render();return;}
  if(t.closest("[data-action='reset']")){if(confirm("¿Restaurar los datos de ejemplo? Se perderán tus cambios.")){state=JSON.parse(JSON.stringify(SEED));save();ui._pInit=false;render();}return;}
  if(t.closest("[data-action='clear-tx']")){
    var n=state.transactions.length;
    if(!n){alert("No hay movimientos que borrar.");return;}
    if(confirm("¿Borrar los "+n+" movimientos registrados? Esta acción no se puede deshacer.\n\nEl presupuesto (grupos, categorías y montos) se mantiene igual.")){
      if(confirm("Confirma una vez más: se eliminarán TODOS los movimientos, empezando de cero.")){
        state.transactions=[];save();ui._pInit=false;ui.view="movimientos";render();
      }
    }
    return;
  }
  if((el=t.closest("[data-cur]"))){ui.cur=el.dataset.cur;render();return;}
  if((el=t.closest("[data-dashsort]"))){var dk=el.getAttribute("data-dashsort");if(ui.dashSort&&ui.dashSort.key===dk){ui.dashSort.dir=ui.dashSort.dir==="desc"?"asc":"desc";}else{ui.dashSort={key:dk,dir:"desc"};}render();return;}
  if((el=t.closest("[data-pyear]"))){ui.pMode="year";ui.pYear=el.getAttribute("data-pyear");ui.pMonths=[];render();return;}
  if((el=t.closest("[data-pytd]"))){var yy=el.getAttribute("data-pytd");var lm=+latestYM().slice(5,7);var arr=[];for(var i=1;i<=lm;i++)arr.push(i);ui.pMode="year";ui.pYear=yy;ui.pMonths=arr;render();return;}
  if((el=t.closest("[data-pall]"))){ui.pMode="all";render();return;}
  if((el=t.closest("[data-pmonth]"))){var mnum=+el.getAttribute("data-pmonth");ui.pMode="year";ui.pMonths=[mnum];render();return;}
  if(t.closest("[data-pallmonths]")){ui.pMonths=[];render();return;}
  if(t.closest("[data-pavg]")){ui.pAvg=!ui.pAvg;render();return;}
  if((el=t.closest("[data-pperson]"))){ui.pPerson=el.getAttribute("data-pperson");render();return;}

  if((el=t.closest("[data-colmenu]"))){var _th=el.closest("th");openColMenu(el.getAttribute("data-colmenu"),_th.getBoundingClientRect());return;}
  if((el=t.closest("[data-sort]"))){if(POPCOL)ui.sort={col:POPCOL,dir:el.getAttribute("data-sort")};closePop();render();return;}
  if(t.closest("[data-clearcol]")){if(POPCOL)ui.colFilters[POPCOL]=null;closePop();render();return;}
  if(t.closest("[data-popclose]")){closePop();return;}
  if((el=t.closest("[data-exp]"))){var k=el.getAttribute("data-exp");ui.expand[k]=!ui.expand[k];render();return;}
  if((el=t.closest("[data-editcatbtn]"))){openEditCat(el.getAttribute("data-editcatbtn"));return;}
  if((el=t.closest("[data-renameperson]"))){renamePerson(+el.getAttribute("data-renameperson"));return;}
  if((el=t.closest("[data-delcat]"))){delCat(el.getAttribute("data-delcat"));return;}
  if((el=t.closest("[data-dashgexp]"))){var dg=el.getAttribute("data-dashgexp");ui.dashExpand[dg]=!ui.dashExpand[dg];render();return;}
  if((el=t.closest("[data-kpiclick]"))){var kc=el.getAttribute("data-kpiclick");if(kc==="income")openIncomeDetail();return;}
  if((el=t.closest("[data-quickaddg]"))){openTx(el.getAttribute("data-quickaddg"),el.getAttribute("data-quickaddc"));return;}
  if((el=t.closest("[data-cat]"))){openCatDetail(el.dataset.cat);return;}
  if((el=t.closest("[data-groupdetail]"))){openGroupDetail(el.getAttribute("data-groupdetail"));return;}
  if((el=t.closest("[data-txtype]"))){txType=el.getAttribute("data-txtype");renderTxBody();return;}
  if(t.closest("[data-savetx]")){saveTx();return;}
  if(t.closest("[data-savecat]")){saveCat();return;}
  if(t.closest("[data-savegroup]")){saveGroup();return;}
  if((el=t.closest("[data-saveeditcat]"))){saveEditCat(el.getAttribute("data-saveeditcat"));return;}
  if((el=t.closest("[data-savebudget]"))){var nm=el.getAttribute("data-savebudget");var val=parseFloat(document.getElementById("d_budget").value)||0;if(ui.cur==="NIO")val=val/tc();state.categories.forEach(function(c){if(c.name===nm)c.budget=val;});save();closeModal();render();return;}
  if(t.closest("[data-close]")||t.hasAttribute("data-overlay")){closeModal();return;}
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.hasAttribute&&t.hasAttribute("data-impf")&&t.getAttribute("data-impf")==="group"){
    var i=t.getAttribute("data-impi");var r=(ui._imp||[])[+i];if(!r)return;
    r.group=t.value;t.style.borderColor="";t.style.color="";t.style.fontWeight="";
    var copts=state.categories.filter(function(c){return c.type===r.type&&c.group===r.group;}).map(function(c){return c.name;});
    if(!copts.length)copts=["Por clasificar"];copts=alpha(copts);
    r.category=copts[0];
    var csel=document.querySelector('[data-impf="category"][data-impi="'+i+'"]');
    if(csel){csel.innerHTML=copts.map(function(c){return '<option>'+esc(c)+'</option>';}).join("");csel.style.borderColor="";csel.style.color="";csel.style.fontWeight="";}
    return;
  }
  if(t.hasAttribute&&t.hasAttribute("data-impf")&&t.getAttribute("data-impf")==="category"){
    var i2=t.getAttribute("data-impi");var r2=(ui._imp||[])[+i2];if(r2){r2.category=t.value;}
    t.style.borderColor="";t.style.color="";t.style.fontWeight="";
    return;
  }
  if(t.hasAttribute&&(t.hasAttribute("data-colcheck")||t.hasAttribute("data-selectall"))){var boxes=Array.prototype.slice.call(document.querySelectorAll("[data-colcheck]"));if(t.hasAttribute("data-selectall")){boxes.forEach(function(b){b.checked=t.checked;});}var checked=boxes.filter(function(b){return b.checked;}).map(function(b){return b.getAttribute("data-colcheck");});var sa=document.querySelector("[data-selectall]");if(sa)sa.checked=(checked.length===boxes.length);ui.colFilters[POPCOL]=(checked.length===boxes.length)?null:checked;render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editgroup")){var id=t.getAttribute("data-editgroup"),g=t.value;state.transactions.forEach(function(r){if(r.id===id){r.group=g;var cats=state.categories.filter(function(c){return c.type===r.type&&c.group===g;}).map(function(c){return c.name;});if(cats.indexOf(r.category)<0)r.category=cats.length?cats[0]:r.category;}});save();render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editcat")){var id2=t.getAttribute("data-editcat"),cat=t.value;var m=state.categories.filter(function(c){return c.name===cat;})[0];state.transactions.forEach(function(r){if(r.id===id2){r.category=cat;if(m)r.group=m.group;}});save();render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editbudgetr")){var cnr=t.getAttribute("data-editbudgetr");var br=parseFloat(t.value)||0;if(ui.cur==="NIO")br=br/tc();state.categories.forEach(function(c){if(c.name===cnr)c.budgetR=br;});save();render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editbudgetm")){var cnm=t.getAttribute("data-editbudgetm");var bm=parseFloat(t.value)||0;if(ui.cur==="NIO")bm=bm/tc();state.categories.forEach(function(c){if(c.name===cnm)c.budgetM=bm;});save();render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editincbudgetr")){var inr=t.getAttribute("data-editincbudgetr");var ibr=parseFloat(t.value)||0;if(ui.cur==="NIO")ibr=ibr/tc();state.categories.forEach(function(c){if(c.name===inr)c.budgetR=ibr;});save();render();return;}
  if(t.hasAttribute&&t.hasAttribute("data-editincbudgetm")){var inm=t.getAttribute("data-editincbudgetm");var ibm=parseFloat(t.value)||0;if(ui.cur==="NIO")ibm=ibm/tc();state.categories.forEach(function(c){if(c.name===inm)c.budgetM=ibm;});save();render();return;}
});
document.addEventListener("input",function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute("data-colsearch")){var q=e.target.value.toLowerCase();Array.prototype.slice.call(document.querySelectorAll(".pop-list .pop-item")).forEach(function(it){it.style.display=it.textContent.toLowerCase().indexOf(q)>=0?"":"none";});return;}
  if(e.target.id==="searchBox"){ui.q=e.target.value;render();var nb=document.getElementById("searchBox");if(nb){nb.focus();nb.value=ui.q;nb.setSelectionRange(ui.q.length,ui.q.length);}}
});

/* ===== drag-to-reorder groups ===== */
var dragG=null;
function reorderGroups(from,to){var arr=groupOrder().filter(function(g){return g!=="Ingresos";});var fi=arr.indexOf(from),ti=arr.indexOf(to);if(fi<0||ti<0||fi===ti)return;arr.splice(fi,1);arr.splice(ti,0,from);state.settings.groups=arr;save();render();}
document.addEventListener("dragstart",function(e){var el=e.target.closest("[data-drag-group]");if(!el)return;dragG=el.getAttribute("data-drag-group");el.classList.add("dragging");if(e.dataTransfer){e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragG);}catch(x){}}});
document.addEventListener("dragend",function(e){var el=e.target.closest("[data-drag-group]");if(el)el.classList.remove("dragging");document.querySelectorAll(".grp-h.drag-over").forEach(function(x){x.classList.remove("drag-over");});dragG=null;});
document.addEventListener("dragover",function(e){var el=e.target.closest("[data-drag-group]");if(!el||!dragG)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";document.querySelectorAll(".grp-h.drag-over").forEach(function(x){if(x!==el)x.classList.remove("drag-over");});el.classList.add("drag-over");});
document.addEventListener("drop",function(e){var el=e.target.closest("[data-drag-group]");if(!el||!dragG)return;e.preventDefault();var to=el.getAttribute("data-drag-group");el.classList.remove("drag-over");if(to!==dragG)reorderGroups(dragG,to);dragG=null;});

(function(){
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}
  _auth=firebase.auth(); _db=firebase.firestore();
  _docref=_db.collection("presupuesto").doc("hogar");
  var gate=document.getElementById("authGate"), appRoot=document.getElementById("appRoot");
  var btn=document.getElementById("authBtn"), msg=document.getElementById("authMsg");
  var emailI=document.getElementById("authEmail"), passI=document.getElementById("authPass");
  function authErr(e){var c=(e&&e.code)||"";
    if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0)return "Correo o contrase\u00f1a incorrectos.";
    if(c.indexOf("user-not-found")>=0)return "Ese correo no est\u00e1 registrado.";
    if(c.indexOf("invalid-email")>=0)return "El correo no es v\u00e1lido.";
    if(c.indexOf("too-many-requests")>=0)return "Demasiados intentos, espera un momento.";
    if(c.indexOf("network")>=0)return "Sin conexi\u00f3n a internet.";
    return "No se pudo entrar. ("+c+")";}
  function doLogin(){msg.textContent="";var em=(emailI.value||"").trim(),pw=passI.value||"";
    if(!em||!pw){msg.textContent="Escribe correo y contrase\u00f1a.";return;}
    btn.disabled=true;btn.textContent="Entrando\u2026";
    _auth.signInWithEmailAndPassword(em,pw).catch(function(e){msg.textContent=authErr(e);}).finally(function(){btn.disabled=false;btn.textContent="Entrar";});}
  btn.addEventListener("click",doLogin);
  passI.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  emailI.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
  document.addEventListener("click",function(e){var l=e.target.closest&&e.target.closest('[data-action=\"logout\"]');if(l){e.preventDefault();if(_unsub){_unsub();_unsub=null;}_booted=false;if(_auth)_auth.signOut();}});
  function attachCloud(){
    _unsub=_docref.onSnapshot(function(snap){
      if(snap.exists&&snap.data()&&snap.data().state){state=snap.data().state;migrate();render();}
      else{state=load();migrate();cloudSave();render();}
    },function(err){console.error("sync",err);state=load();migrate();render();});
  }
  _auth.onAuthStateChanged(function(user){
    if(user){gate.style.display="none";appRoot.style.display="flex";if(!_booted){_booted=true;attachCloud();}}
    else{appRoot.style.display="none";gate.style.display="grid";passI.value="";}
  });
})();
</script>
